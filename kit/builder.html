<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tryout Test Builder</title>
<style>
  html,body{margin:0;min-height:100%}
  body{background:#201E2B;color:#fff;font:15px/1.55 Inter,"Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;display:flex;flex-direction:column;min-height:100vh}
  header{padding:28px clamp(20px,5vw,72px) 0}
  header img{height:26px}
  main{flex:1;display:grid;align-content:center;padding:24px clamp(20px,5vw,72px);max-width:760px;gap:20px}
  h1{font-size:clamp(30px,4.4vw,46px);line-height:1.05;margin:0}
  h1 span{display:block;color:#F4C95D}
  p{margin:0;color:#DAD6EA;max-width:60ch}
  .drop{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
  .slot{border:1.5px dashed #413C58;border-radius:10px;padding:16px;display:grid;gap:6px;cursor:pointer;transition:border-color .2s,background .2s}
  .slot:hover,.slot.over{border-color:#F4C95D;background:#2B2838}
  .slot.ok{border-style:solid;border-color:#5CC98C}
  .slot b{font-size:15px}
  .slot span{font-size:13px;color:#B5AFD1;overflow-wrap:anywhere}
  .slot input{display:none}
  .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
  button{font:inherit;font-weight:700;border:1px solid #6D5DF6;background:#6D5DF6;color:#fff;border-radius:6px;padding:12px 22px;cursor:pointer}
  button:disabled{opacity:.45;cursor:default}
  .msg{font-size:14px;color:#B5AFD1}
  .msg.bad{color:#FFB8A6}
  .msg.good{color:#9FE3BD;font-weight:700}
  ul{margin:0;padding-left:18px;display:grid;gap:4px}
  footer{padding:0 clamp(20px,5vw,72px) 22px;font-size:11px;color:#8E89A8}
  @media (max-width:640px){ .drop{grid-template-columns:1fr} }
</style>
</head>
<body>
<header><span style="font-weight:800;font-size:19px">Tryout<span style="display:inline-block;width:7px;height:7px;border-radius:50%;background:#F4C95D;margin-left:2px"></span></span></header>
<main>
  <h1>Usability test<span>builder</span></h1>
  <p>Add the two project files and get one HTML file you can email to participants. Everything happens in this page. Nothing is uploaded.</p>
  <div class="drop">
    <label class="slot" id="slotC"><b>1. test-config.js</b><span id="nameC">The words and the tasks. Click or drop the file here.</span><input type="file" id="fileC" accept=".js,text/javascript"></label>
    <label class="slot" id="slotP"><b>2. prototype.html</b><span id="nameP">The prototype being tested. Click or drop the file here.</span><input type="file" id="fileP" accept=".html,text/html"></label>
  </div>
  <div class="row"><button id="build" type="button" disabled>Build the test file</button><span class="msg" id="msg"></span></div>
  <div class="msg bad" id="errs" hidden></div>
</main>
<footer>Tryout usability kit · the built file is self-contained and works offline.</footer>
<script type="application/json" id="shell">"<!doctype html>\n<html lang=\"en\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<title>Tryout Usability Session<\/title>\n<!--\n  TRYOUT USABILITY TEST SHELL  \u00b7  v1.0  \u00b7  MIT licence\n  This file is the fixed frame of every Tryout usability test. Do not edit it per project.\n  A test is this shell plus two project files, merged by build.py or builder.html:\n    test-config.js   the words and the tasks            -> replaces the UT:CONFIG marker below\n    prototype.html   the prototype being tested          -> replaces the UT:PROTOTYPE marker below\n  Everything the shell owns is prefixed \"ut-\" (classes, ids, CSS variables) so it cannot collide\n  with the prototype. The contract between the two is in PROMPT.md, section \"The contract\".\n-->\n<style>\n  /* Tryout look: plum-black opening screens with white titles and a gold second line, coral for small\n     emphasis labels, violet for actions, generous white space.\n     Layout: slim top bar, the current task on the left, the live prototype on the right. */\n  :root{\n    --ut-navy:#201E2B; --ut-navy-2:#2B2838; --ut-blue:#6D5DF6; --ut-sky:#F4C95D; --ut-mist:#D9D4F5; --ut-deep:#4B3FD1;\n    --ut-flame:#FF7A59; --ut-slate:#5A5668; --ut-silver:#E8E6EF;\n    --ut-bg:#F6F5F9; --ut-panel:#FFFFFF; --ut-ink:#1E1B2E; --ut-ink-2:#4E4A63; --ut-muted:#7D7995; --ut-line:#E6E3EE;\n    --ut-tint:#F0EDFA; --ut-ok:#1C8A5A; --ut-on-blue:#FFFFFF;\n    --ut-scrim:rgba(32,30,43,.55);\n    --ut-font:Inter,\"Segoe UI\",system-ui,-apple-system,Roboto,\"Helvetica Neue\",Arial,sans-serif;\n    --ut-ease:cubic-bezier(.22,.61,.36,1);\n  }\n  @media (prefers-color-scheme: dark){ :root:not([data-theme=\"light\"]){\n    --ut-bg:#141221; --ut-panel:#201E2B; --ut-ink:#F1EFF8; --ut-ink-2:#BDB8D4; --ut-muted:#8E89A8; --ut-line:#343046;\n    --ut-tint:#2A2740; --ut-ok:#5CD29A; --ut-blue:#8B7CFF; --ut-scrim:rgba(8,6,16,.66); color-scheme:dark } }\n  :root[data-theme=\"dark\"]{\n    --ut-bg:#141221; --ut-panel:#201E2B; --ut-ink:#F1EFF8; --ut-ink-2:#BDB8D4; --ut-muted:#8E89A8; --ut-line:#343046;\n    --ut-tint:#2A2740; --ut-ok:#5CD29A; --ut-blue:#8B7CFF; --ut-scrim:rgba(8,6,16,.66); color-scheme:dark }\n\n  html,body{height:100%;margin:0}\n  .ut-top [hidden],.ut-panel [hidden],.ut-cover [hidden]{display:none!important}\n  body{background:var(--ut-bg);color:var(--ut-ink);font-family:var(--ut-font);font-size:14px;line-height:1.5;overflow:hidden}\n  .ut{height:100%;display:grid;grid-template-rows:auto 1fr;gap:12px;padding:12px 16px;box-sizing:border-box}\n  .ut-top button,.ut-panel button,.ut-panel textarea,.ut-cover button,.ut-cover input,.ut-cover textarea{font-family:var(--ut-font)}\n  .ut-top :focus-visible,.ut-panel :focus-visible,.ut-cover :focus-visible{outline:2px solid var(--ut-blue);outline-offset:2px}\n\n  /* Top bar */\n  .ut-top{display:flex;align-items:center;gap:16px;background:var(--ut-panel);border:1px solid var(--ut-line);border-radius:8px;padding:10px 16px;min-width:0}\n  .ut-wordmark{font-weight:800;font-size:17px;letter-spacing:-.01em;display:inline-flex;align-items:baseline;gap:2px}\n  .ut-wordmark i{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--ut-sky)}\n  .ut-cover .ut-wordmark{font-size:19px;color:#fff}\n  .ut-top .ut-sep{width:1px;height:20px;background:var(--ut-line)}\n  .ut-top .ut-name{font-weight:700;font-size:14px;white-space:nowrap}\n  .ut-steps{flex:1;display:flex;gap:4px;min-width:60px;max-width:420px;margin-left:auto}\n  .ut-steps i{flex:1;height:4px;border-radius:2px;background:var(--ut-line);transition:background .4s var(--ut-ease)}\n  .ut-steps i.ut-done{background:var(--ut-blue)}\n  .ut-steps i.ut-skip{background:var(--ut-mist)}\n  .ut-steps i.ut-now{background:var(--ut-flame)}\n  .ut-count{font-size:12px;color:var(--ut-muted);white-space:nowrap;font-variant-numeric:tabular-nums}\n  .ut-recdot{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;color:var(--ut-flame);white-space:nowrap}\n  .ut-recdot i{width:8px;height:8px;border-radius:50%;background:var(--ut-flame);animation:blink 1.6s ease-in-out infinite}\n  @keyframes blink{50%{opacity:.35}}\n  .ut-consent{display:grid;gap:10px;margin-top:2px}\n  .ut-consent label{display:grid;grid-template-columns:18px 1fr;gap:10px;align-items:start;font-size:14px;color:#fff;cursor:pointer}\n  .ut-consent input{margin:3px 0 0;width:16px;height:16px;accent-color:#6D5DF6}\n  .ut-consent small{display:block;color:#B5AFD1;font-size:12.5px;line-height:1.4}\n  .ut-linkbtn{background:none;border:0;color:var(--ut-ink-2);font-size:12px;text-decoration:underline;text-underline-offset:3px;cursor:pointer;padding:2px}\n  .ut-linkbtn.ut-warn{color:var(--ut-flame)}\n\n  /* Body */\n  .ut-body{display:grid;grid-template-columns:360px 1fr;gap:12px;min-height:0}\n  .ut-panel{background:var(--ut-panel);border:1px solid var(--ut-line);border-radius:8px;overflow:auto;min-height:0}\n  .ut-panel-in{padding:24px 22px;display:flex;flex-direction:column;gap:16px;transition:opacity .18s var(--ut-ease),transform .24s var(--ut-ease)}\n  .ut-panel-in.ut-out{opacity:0;transform:translateY(6px)}\n  /* The prototype lives in #ut-proto. contain:layout keeps its fixed-position layers inside the stage. */\n  .ut-stage{contain:layout;position:relative;border:1px solid var(--ut-line);border-radius:8px;overflow:hidden;background:#fff;min-height:0}\n  #ut-proto{height:100%;width:100%;position:relative;overflow:auto;color:#1E1B2E}\n  .ut-gate{position:absolute;inset:0;z-index:2000000;background:var(--ut-scrim);display:grid;place-items:center;padding:16px;opacity:0;pointer-events:none;transition:opacity .35s var(--ut-ease)}\n  .ut-gate.ut-show{opacity:1;pointer-events:auto}\n  .ut-gate p{margin:0;background:var(--ut-panel);color:var(--ut-ink);border-radius:8px;padding:12px 18px;font-size:14px;max-width:320px;text-align:center}\n\n  /* Task panel */\n  .ut-label{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ut-flame);margin:0}\n  h1.ut-task{font-size:24px;font-weight:700;line-height:1.2;margin:0;text-wrap:balance}\n  .ut-story{font-size:15px;line-height:1.55;color:var(--ut-ink-2);margin:0}\n  .ut-story b{color:var(--ut-ink)}\n  .ut-story b:last-child{display:block;margin-top:8px;color:var(--ut-ink)}\n  .ut-goal{background:var(--ut-tint);border-radius:8px;padding:12px 14px}\n  .ut-goal b{display:block;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--ut-blue);margin-bottom:4px}\n  .ut-goal span{font-size:15px;font-weight:700;color:var(--ut-ink);line-height:1.4}\n  .ut-aside{font-size:12.5px;color:var(--ut-muted);margin:0}\n  .ut-subs{list-style:none;margin:0;padding:0;display:grid;gap:8px}\n  .ut-subs li{display:grid;grid-template-columns:18px 1fr;gap:10px;align-items:start;font-size:13.5px;color:var(--ut-ink-2);transition:color .3s}\n  .ut-subs .ut-box{width:18px;height:18px;border-radius:50%;border:1.5px solid var(--ut-line);box-sizing:border-box;display:grid;place-items:center;margin-top:1px;transition:background .3s var(--ut-ease),border-color .3s}\n  .ut-subs li.ut-on{color:var(--ut-ink)}\n  .ut-subs li.ut-on .ut-box{background:var(--ut-ok);border-color:var(--ut-ok)}\n  .ut-subs .ut-box svg{opacity:0;transform:scale(.4);transition:opacity .2s,transform .3s var(--ut-ease)}\n  .ut-subs li.ut-on .ut-box svg{opacity:1;transform:scale(1)}\n  .ut-subs li.ut-opt .ut-lbl::after{content:\" \u00b7 bonus\";color:var(--ut-flame);font-size:12px}\n  .ut-note{font-size:13px;border-radius:8px;padding:10px 12px;background:var(--ut-tint);color:var(--ut-ink);opacity:1;transition:opacity .3s}\n  .ut-note b{display:block;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--ut-flame);margin-bottom:2px}\n  .ut-foot{display:flex;align-items:center;gap:10px;border-top:1px solid var(--ut-line);padding-top:14px;flex-wrap:wrap}\n  .ut-clock{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--ut-muted);margin-right:auto}\n  .ut-clock .ut-ring-bg{stroke:var(--ut-line)}\n  .ut-clock .ut-ring{stroke:var(--ut-blue);transition:stroke-dashoffset 1s linear,stroke .4s}\n  .ut-clock.ut-over .ut-ring{stroke:var(--ut-muted)}\n  .ut-clock .ut-mm{font-weight:700;color:var(--ut-ink);font-variant-numeric:tabular-nums}\n  .ut-row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}\n  .ut-btn{border:1px solid var(--ut-line);background:var(--ut-panel);color:var(--ut-ink);border-radius:6px;padding:9px 16px;font-size:14px;font-weight:700;cursor:pointer;transition:background .2s,border-color .2s,transform .12s,box-shadow .2s}\n  .ut-btn:hover{border-color:var(--ut-ink-2)}\n  .ut-btn:active{transform:scale(.98)}\n  .ut-btn.ut-primary{background:var(--ut-blue);border-color:var(--ut-blue);color:var(--ut-on-blue)}\n  .ut-btn.ut-primary:hover{box-shadow:0 4px 14px rgba(29,110,228,.28)}\n  .ut-btn.ut-ghost{border-color:transparent;color:var(--ut-ink-2);font-weight:400}\n  .ut-btn.ut-ghost:hover{border-color:var(--ut-line)}\n\n  /* Result */\n  .ut-won{display:flex;flex-direction:column;align-items:flex-start;gap:10px}\n  .ut-won h2{font-size:22px;font-weight:700;line-height:1.2;margin:0 0 4px}\n  .ut-won p{margin:0;font-size:13.5px;color:var(--ut-ink-2)}\n  .ut-medal{width:56px;height:56px;border-radius:50%;display:grid;place-items:center;background:var(--ut-navy);color:#fff;box-shadow:0 0 0 3px var(--ut-sky);position:relative}\n  .ut-medal svg{width:24px;height:24px}\n  .ut-medal.ut-pop{animation:pop .55s var(--ut-ease) both}\n  .ut-medal.ut-soft{background:transparent;color:var(--ut-muted);box-shadow:0 0 0 1.5px var(--ut-muted)}\n  @keyframes pop{0%{transform:scale(.6);opacity:0}100%{transform:scale(1);opacity:1}}\n  .ut-q{display:grid;gap:10px}\n  .ut-ql{font-size:14px;font-weight:700}\n  .ut-scale{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}\n  .ut-scale button{border:1px solid var(--ut-line);background:var(--ut-panel);color:var(--ut-ink);border-radius:6px;padding:9px 2px 7px;cursor:pointer;display:grid;gap:2px;justify-items:center;transition:background .2s,border-color .2s,color .2s}\n  .ut-scale button:hover{border-color:var(--ut-blue)}\n  .ut-scale button b{font-size:15px}\n  .ut-scale button small{font-size:10.5px;color:var(--ut-muted);line-height:1.15;text-align:center}\n  .ut-scale button[aria-pressed=\"true\"]{background:var(--ut-blue);border-color:var(--ut-blue);color:#fff}\n  .ut-scale button[aria-pressed=\"true\"] small{color:#fff}\n  .ut-chips{display:flex;flex-wrap:wrap;gap:6px}\n  .ut-chips button{border:1px solid var(--ut-line);background:var(--ut-panel);color:var(--ut-ink-2);border-radius:999px;padding:6px 12px;font-size:12.5px;cursor:pointer;transition:background .2s,color .2s}\n  .ut-chips button[aria-pressed=\"true\"]{background:var(--ut-navy);border-color:var(--ut-navy);color:#fff}\n  .ut-panel textarea:focus,.ut-cover textarea:focus,.ut-cover input[type=\"text\"]:focus{outline:none;border-color:var(--ut-blue);box-shadow:0 0 0 1px var(--ut-blue)}\n  .ut-panel textarea,.ut-cover textarea,.ut-cover input[type=\"text\"]{width:100%;box-sizing:border-box;border:1px solid var(--ut-line);background:var(--ut-panel);color:var(--ut-ink);border-radius:6px;padding:9px 11px;font:14px/1.45 var(--ut-font);resize:vertical}\n  .ut-more{display:grid;grid-template-rows:0fr;transition:grid-template-rows .3s var(--ut-ease)}\n  .ut-more.ut-open{grid-template-rows:1fr}\n  .ut-more > div{overflow:hidden}\n  .ut-stat{font-size:12px;color:var(--ut-muted)}\n\n  /* Cover screens (intro and finale): the template's navy opening slides */\n  .ut-cover{position:fixed;inset:0;z-index:3000000;background:#201E2B;color:#fff;display:flex;flex-direction:column;overflow:auto;transition:opacity .45s var(--ut-ease),visibility .45s}\n  .ut-cover.ut-gone{opacity:0;visibility:hidden;pointer-events:none}\n  .ut-cover-top{display:flex;align-items:center;justify-content:space-between;padding:28px clamp(20px,5vw,72px) 0}\n  .ut-cover-top img{height:26px}\n  .ut-cover-main{flex:1;display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:32px;padding:24px clamp(20px,5vw,72px)}\n  .ut-slide{max-width:620px;display:flex;flex-direction:column;gap:18px;animation:rise .5s var(--ut-ease) both}\n  @keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}\n  .ut-cover h1{font-size:clamp(34px,5vw,54px);font-weight:700;line-height:1.05;margin:0;letter-spacing:-.01em}\n  .ut-cover h1 span{display:block;color:#F4C95D}\n  .ut-cover h2{font-size:clamp(22px,2.6vw,30px);font-weight:700;line-height:1.2;margin:0;text-wrap:balance}\n  .ut-cover .ut-year{font-size:15px;font-weight:700;color:#F4C95D;margin:0}\n  .ut-cover p{margin:0;font-size:16px;line-height:1.55;color:#DAD6EA;max-width:58ch}\n  .ut-cover .ut-em{color:#FF7A59;font-weight:700}\n  .ut-cover .ut-kicker{font-size:12px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:#FF7A59;margin:0}\n  .ut-groups{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:22px;margin-top:4px}\n  .ut-groups div{display:grid;gap:4px;align-content:start}\n  .ut-groups b{font-size:15px;color:#fff}\n  .ut-groups span{font-size:13.5px;color:#B5AFD1;line-height:1.45}\n  .ut-agenda{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));grid-template-rows:repeat(var(--ut-rows,4),auto);grid-auto-flow:column;gap:8px 28px}\n  .ut-agenda li{display:grid;grid-template-columns:48px 1fr;gap:8px;font-size:14.5px;color:#fff}\n  .ut-agenda .ut-tm{color:#F4C95D;font-weight:700;font-variant-numeric:tabular-nums}\n  .ut-cover label{font-size:13px;color:#B5AFD1}\n  .ut-cover input[type=\"text\"]{background:transparent;border:1px solid #413C58;color:#fff;max-width:320px}\n  .ut-cover input[type=\"text\"]:focus{border-color:#F4C95D;outline:none}\n  .ut-cover .ut-btn.ut-primary{background:#6D5DF6;border-color:#6D5DF6;color:#fff;padding:12px 22px;font-size:15px}\n  .ut-cover .ut-btn.ut-ghost{background:transparent;color:#B5AFD1}\n  .ut-cover .ut-btn.ut-ghost:hover{border-color:#413C58}\n  .ut-cover-foot{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:0 clamp(20px,5vw,72px) 22px;font-size:11px;color:#8E89A8}\n  .ut-cover-foot .ut-dots{display:flex;gap:6px}\n  .ut-cover-foot .ut-dots i{width:18px;height:3px;border-radius:2px;background:#3A3550;transition:background .3s}\n  .ut-cover-foot .ut-dots i.ut-on{background:#F4C95D}\n  .ut-cover .ut-medals{display:flex;flex-wrap:wrap;gap:18px 12px}\n  .ut-cover .ut-medals figure{margin:0;display:grid;justify-items:center;align-content:start;gap:10px;width:86px;text-align:center}\n  .ut-cover .ut-medals figcaption{font-size:12px;line-height:1.3;color:#fff}\n  .ut-cover .ut-medals figcaption small{display:block;color:#8E89A8;font-size:11px}\n  .ut-cover .ut-medal.ut-soft{color:#8E89A8;box-shadow:0 0 0 1.5px #555070}\n  .ut-tally{display:flex;gap:36px;flex-wrap:wrap}\n  .ut-tally div{display:grid}\n  .ut-tally b{font-size:36px;font-weight:700;line-height:1;color:#fff;font-variant-numeric:tabular-nums}\n  .ut-tally span{font-size:12.5px;color:#B5AFD1}\n  .ut-cover .ut-scale button{background:transparent;border-color:#413C58;color:#fff}\n  .ut-cover .ut-scale button small{color:#B5AFD1}\n  .ut-cover .ut-scale button:hover{border-color:#F4C95D}\n  .ut-cover .ut-scale button[aria-pressed=\"true\"]{background:#6D5DF6;border-color:#6D5DF6}\n  .ut-cover textarea{background:transparent;border-color:#413C58;color:#fff}\n  .ut-copied{font-size:13px;color:#9FE3BD;font-weight:700}\n  #ut-resultsText{font-family:ui-monospace,Menlo,monospace;font-size:11.5px;min-height:120px}\n  .ut-sent{display:grid;gap:12px;animation:rise .4s var(--ut-ease) both}\n  .ut-sent ol{margin:0;padding-left:22px;display:grid;gap:8px;font-size:15px;color:#DAD6EA;list-style:decimal outside}\n  .ut-sent ol li{display:list-item}\n  .ut-sent ol li::marker{color:#F4C95D;font-weight:700}\n  .ut-sent 're looking for.<\/span><\/div>\n            <div><b>Skip anytime<\/b><span>Skipping tells us as much.<\/span><\/div>\n          <\/div>\n          <div class=\"ut-row\"><button class=\"ut-btn ut-primary\" id=\"ut-n1\" type=\"button\">Next<\/button><\/div>\n        <\/div>`;\n      $(\"n1\").onclick = () => intro(2); $(\"n1\").focus();\n    } else {\n      m.innerHTML = `<div class=\"ut-slide\">\n          <h2>${esc(CFG.persona)}<\/h2>\n          <ol class=\"ut-agenda\" style=\"--ut-rows:${Math.ceil(TASKS.length/2)}\">${TASKS.map((t) => `<li><span class=\"ut-tm\">${esc(t.time)}<\/span><span>${esc(t.title)}<\/span><\/li>`).join(\"\")}<\/ol>\n          <p>${esc(CFG.disclaimer || \"People and data are made up. Nothing is sent anywhere.\")}<\/p>\n          <div style=\"display:grid;gap:6px\"><label for=\"ut-who\">Your name or participant code (optional)<\/label><input type=\"text\" id=\"ut-who\" autocomplete=\"off\" value=\"${esc(S.who)}\"><\/div>\n          <div class=\"ut-consent\">\n            <label><input type=\"checkbox\" id=\"ut-recScreen\" ${REC.want.screen?\"checked\":\"\"}><span>Record this page so the team can replay the session<small>Clicks, typing and screens on this page only. Not your camera or other apps.<\/small><\/span><\/label>\n            <label><input type=\"checkbox\" id=\"ut-recVoice\" ${REC.want.voice?\"checked\":\"\"} ${inFrame?\"disabled\":\"\"}><span>Also record my voice<small>${inFrame ? \"Works when you open the HTML file directly in Chrome, Edge or Safari.\" : \"Your browser will ask for the microphone. You can say no and still take part.\"}<\/small><\/span><\/label>\n            <label><input type=\"checkbox\" id=\"ut-recCamera\" ${REC.want.camera?\"checked\":\"\"} ${inFrame?\"disabled\":\"\"}><span>Also record my camera<small>${inFrame ? \"Works when you open the HTML file directly in your browser.\" : \"A small video of you, saved as a separate file. Off unless you tick it.\"}<\/small><\/span><\/label>\n          <\/div>\n          <div class=\"ut-row\"><button class=\"ut-btn ut-ghost\" id=\"ut-b2\" type=\"button\">Back<\/button><button class=\"ut-btn ut-primary\" id=\"ut-go3\" type=\"button\">Start<\/button><\/div>\n        <\/div>`;\n      $(\"b2\").onclick = () => intro(1);\n      $(\"who\").oninput = (e) => { S.who = e.target.value.trim(); };\n      $(\"recScreen\").onchange = (e) => { REC.want.screen = e.target.checked; };\n      $(\"recVoice\").onchange = (e) => { REC.want.voice = e.target.checked; };\n      $(\"recCamera\").onchange = (e) => { REC.want.camera = e.target.checked; };\n      $(\"go3\").onclick = begin; $(\"go3\").focus();\n    }\n  }\n  function begin(){\n    startRecording();\n    $(\"intro\").classList.add(\"ut-gone\");\n    S.started = new Date(); S.i = 0; S.phase = \"brief\";\n    syncViewport(); emit(\"ut:reset\");\n    setTimeout(() => { runSetup(TASKS[0]); render(true); }, 60);\n  }\n\n  // ---- Finale: celebrate first, then the same two closing questions in every test ------------\n  function finish(){\n    mark(\"Session finished\"); REC.done = stopRecording();\n    S.phase = \"done\"; S.finishedAt = new Date(); paintSteps(); $(\"gate\").classList.remove(\"ut-show\");\n    panel.innerHTML = `<p class=\"ut-label\">Session complete<\/p><h1 class=\"ut-task\">Thank you.<\/h1><div class=\"ut-row\"><button class=\"ut-btn\" id=\"ut-reopen\" type=\"button\">Show my results<\/button><\/div>`;\n    $(\"reopen\").onclick = () => { $(\"finale\").classList.remove(\"ut-gone\"); };\n    $(\"finale\").classList.remove(\"ut-gone\");\n    finalePage(1);\n  }\n  function finalePage(page){\n    const m = $(\"finMain\"), res = S.results; dots(\"finDots\", page-1);\n    if (page===1){\n      const earned = res.filter((r) => r.status && r.status!==\"skipped\").length;\n      const mins = Math.max(1, Math.round((S.finishedAt - S.started)/60000));\n      const tally = FIN.tally && FIN.tally.signal ? `<div><b>${res.reduce((a,r) => a + r.trail.filter((x) => x.type===FIN.tally.signal).length, 0)}<\/b><span>${esc(FIN.tally.label || FIN.tally.signal)}<\/span><\/div>` : \"\";\n      m.innerHTML = `<div class=\"ut-slide\" style=\"max-width:720px\">\n          <p class=\"ut-kicker\">${esc(FIN.kicker)}<\/p>\n          <h1>${esc(FIN.title)}<span>${esc(FIN.accent)}<\/span><\/h1>\n          <div class=\"ut-tally\"><div><b>${earned}<\/b><span>of ${TASKS.length} badges<\/span><\/div>${tally}<div><b>${mins}<\/b><span>minutes<\/span><\/div><\/div>\n          <div class=\"ut-medals\">${TASKS.map((t,k) => { const r = res[k], got = r.status && r.status!==\"skipped\";\n            return `<figure><div class=\"ut-medal ${got?\"ut-pop\":\"ut-soft\"}\" style=\"animation-delay:${k*80}ms\">${ICON[t.badge.icon]}<\/div><figcaption>${esc(t.badge.name)}<small>${got?esc(t.time):\"Skipped\"}<\/small><\/figcaption><\/figure>`; }).join(\"\")}<\/div>\n          <div class=\"ut-row\"><button class=\"ut-btn ut-primary\" id=\"ut-f1\" type=\"button\">Two last questions<\/button><\/div>\n        <\/div>`;\n      $(\"f1\").onclick = () => finalePage(2); $(\"f1\").focus();\n    } else {\n      m.innerHTML = `<div class=\"ut-slide\" style=\"max-width:640px\">\n          <p class=\"ut-kicker\">Almost there<\/p>\n          <div class=\"ut-q\"><span class=\"ut-ql\" id=\"ut-q1\">Overall, how easy was ${esc(PROJECT)} to use?<\/span><div class=\"ut-scale\" role=\"group\" aria-labelledby=\"ut-q1\" data-k=\"overall\">${EASE.map((e,k)=>`<button type=\"button\" data-v=\"${k+1}\" aria-pressed=\"${S.closing.overall===k+1}\"><b>${k+1}<\/b><small>${e}<\/small><\/button>`).join(\"\")}<\/div><\/div>\n          <div class=\"ut-q\"><span class=\"ut-ql\" id=\"ut-q2\">${esc(CFG.wouldUseQuestion || \"Would you use something like this in your own work?\")}<\/span><div class=\"ut-scale\" role=\"group\" aria-labelledby=\"ut-q2\" data-k=\"likely\">${LIKELY.map((e,k)=>`<button type=\"button\" data-v=\"${k+1}\" aria-pressed=\"${S.closing.likely===k+1}\"><b>${k+1}<\/b><small>${e}<\/small><\/button>`).join(\"\")}<\/div><\/div>\n          <div class=\"ut-q\"><label for=\"ut-change\" class=\"ut-ql\" style=\"color:#fff\">Anything you'd change? (optional)<\/label><textarea id=\"ut-change\" rows=\"2\">${esc(S.closing.change)}<\/textarea><\/div>\n          <div class=\"ut-row\" id=\"ut-sendRow\"><button class=\"ut-btn ut-ghost\" id=\"ut-b4\" type=\"button\">Back<\/button><button class=\"ut-btn ut-primary\" id=\"ut-send\" type=\"button\">Finish and get my results file<\/button><\/div>\n          <div class=\"ut-sent\" id=\"ut-sent\" hidden><\/div>\n        <\/div>`;\n      m.querySelectorAll(\".ut-scale\").forEach((g) => g.querySelectorAll(\"button\").forEach((b) => b.onclick = () => {\n        S.closing[g.dataset.k] = +b.dataset.v; g.querySelectorAll(\"button\").forEach((x) => x.setAttribute(\"aria-pressed\", String(x===b))); }));\n      $(\"change\").oninput = (e) => { S.closing.change = e.target.value; };\n      $(\"b4\").onclick = () => finalePage(1);\n      // One file per session. The time and a short session code keep names unique when people test at once.\n      const fileName = () => { const d = S.started; const pad = (n) => String(n).padStart(2,\"0\");\n        return `${slug(PROJECT) || \"Prototype\"}-usability-${slug(S.who) || \"participant\"}-${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}-${pad(d.getHours())}${pad(d.getMinutes())}-${S.sid}.txt`; };\n      const mailHref = (name) => {\n        const sep = /Win/i.test(navigator.platform || \"\") ? \";\" : \",\";\n        let body = resultsText().split(\"\\n\").filter((l) => !/^\\s+Trail:/.test(l)).join(\"\\n\");\n        if (body.length > 1400) body = body.slice(0, 1400) + \"\\n\u2026\";\n        body = `>> BEFORE YOU SEND: attach the file ${name} from your Downloads folder. <<\\n\\n` + body;\n        return `mailto:${RESULT_EMAILS.join(sep)}?subject=${encodeURIComponent(`${PROJECT} usability results: ${S.who || \"participant\"} (${S.sid})`)}&body=${encodeURIComponent(body)}`;\n      };\n      const saveFile = async (name, data) => {\n        const dl = typeof data === \"string\" && window.claude?.use ? await window.claude.use(\"downloads\") : null;\n        if (dl){ await dl.save({ filename:name, data }); return; }\n        const a = document.createElement(\"a\"); a.href = URL.createObjectURL(data instanceof Blob ? data : new Blob([data], { type:\"text/plain\" })); a.download = name; document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);\n      };\n      $(\"send\").onclick = async () => {\n        const btn = $(\"send\"); btn.disabled = true; btn.textContent = \"Saving\u2026\";\n        const name = fileName();\n        await REC.done;\n        const camName = name.replace(/\\.txt$/, \"-camera.webm\");\n        const recording = REC.events.length ? { events:REC.events, audio:REC.audio, audioAt:REC.audioAt || null, voice:REC.voice, camera: REC.camBlob ? { file:camName, at:REC.cameraAt, type:REC.camBlob.type } : null } : null;\n        const data = resultsText() + (recording ? `\\nRecording: screen${REC.audio ? \" and voice\" : \"\"} included. Open this file in the Tryout replay page to watch it.` : \"\") + \"\\n\\n--- machine-readable ---\\n\" + JSON.stringify({ kit:\"tryout/1\", project:PROJECT, version:VERSION, sid:S.sid, who:S.who, started:S.started, finished:S.finishedAt, results:S.results, closing:S.closing, recording });\n        const box = $(\"sent\");\n        // 1. Fully automatic, when the team has set up a receiving address.\n        if (SUBMIT_URL){\n          try {\n            await fetch(SUBMIT_URL, { method:\"POST\", mode:\"no-cors\", headers:{ \"Content-Type\":\"text/plain\" }, body: JSON.stringify({ filename:name, to:RESULT_EMAILS, subject:`${PROJECT} usability results: ${S.who || \"participant\"} (${S.sid})`, summary:resultsText(), content:data }) });\n            S.saved = true; $(\"sendRow\").hidden = true; box.hidden = false;\n            box.innerHTML = `<h2>Sent. Thank you.<\/h2><p>Your results and recording went to the research team. You can close this page.<\/p>`;\n            return;\n          } catch {}\n        }\n        // 2. Otherwise: save the file and ask the participant to send it to the research team.\n        let saved = true;\n        try { await saveFile(name, data); } catch (e) { saved = false; }\n        if (REC.camBlob){ try { await saveFile(camName, REC.camBlob); } catch {} }\n        S.saved = saved; $(\"sendRow\").hidden = true; box.hidden = false;\n        box.innerHTML = `<h2>One last step: send us your results file<\/h2>\n          <ol>\n            <li>${saved ? `Your results file is in your Downloads folder: <b>${esc(name)}<\/b>` : `Press <b>Save the file again<\/b> below to download your results file.`}${REC.camBlob ? ` Your camera video is there too: <b>${esc(camName)}<\/b>. If your browser asked to allow several downloads, press Allow.` : \"\"}<\/li>\n            <li><b>Email ${REC.camBlob ? \"both files\" : \"that file\"} to <span id=\"ut-addr\" style=\"user-select:all\">${RESULT_EMAILS.map(esc).join(\", \")}<\/span><\/b>, or send ${REC.camBlob ? \"them\" : \"it\"} to the person who invited you another way.<\/li>\n          <\/ol>\n          <div class=\"ut-row\"><button class=\"ut-btn ut-primary\" id=\"ut-copyAddr\" type=\"button\">Copy the email address<\/button><a class=\"ut-btn ut-ghost\" id=\"ut-mail\" href=\"${mailHref(name)}\">Open an email draft<\/a><button class=\"ut-btn ut-ghost\" id=\"ut-again\" type=\"button\">Save the file again<\/button>${REC.camBlob ? `<button class=\"ut-btn ut-ghost\" id=\"ut-againCam\" type=\"button\">Save the camera file again<\/button>` : \"\"}${UPLOAD_URL ? `<a class=\"ut-btn ut-ghost\" href=\"${esc(UPLOAD_URL)}\" target=\"_blank\" rel=\"noopener\">Or upload to the shared folder<\/a>` : \"\"}<\/div>\n          <p class=\"ut-fineprint\">${recording ? `The file holds your session recording${REC.voice===\"on\" ? \" and voice\" : \"\"}${REC.camBlob ? \", and the video file holds your camera\" : \"\"}. ` : \"\"}Nothing leaves your computer until you send the file.<\/p>`;\n        // Copying the address always works. The email draft is optional: it depends on the mail app set up on each computer.\n        $(\"copyAddr\").onclick = async () => {\n          const b = $(\"copyAddr\"); let ok = true;\n          try { await navigator.clipboard.writeText(RESULT_EMAILS.join(\", \")); }\n          catch { try { const r = document.createRange(); r.selectNodeContents($(\"addr\")); const sel = getSelection(); sel.removeAllRanges(); sel.addRange(r); ok = document.execCommand(\"copy\"); } catch { ok = false; } }\n          b.textContent = ok ? \"Copied\" : \"Select the address above\"; setTimeout(() => { b.textContent = \"Copy the email address\"; }, 2500);\n        };\n        $(\"again\").onclick = () => saveFile(name, data).then(() => { S.saved = true; }).catch(() => {});\n        if (REC.camBlob) $(\"againCam\").onclick = () => saveFile(camName, REC.camBlob).catch(() => {});\n      };\n    }\n    $(\"finale\").scrollTop = 0;\n  }\n  // The results summary: the same shape in every Tryout test.\n  function resultsText(){\n    const L = [];\n    const trailItem = (x) => { const { at, type, ...rest } = x; let d = Object.keys(rest).length ? \" \" + JSON.stringify(rest) : \"\"; if (d.length > 90) d = d.slice(0, 90) + \"\u2026\"; return `${mmss(at)} ${type}${d}`; };\n    L.push(`${PROJECT} usability session${VERSION ? ` (${VERSION})` : \"\"}`);\n    L.push(`Participant: ${S.who || \"not given\"} \u00b7 Session ${S.sid}`);\n    L.push(`Date: ${S.started.toLocaleString()} \u00b7 ${Math.max(1, Math.round((S.finishedAt - S.started)/60000))} min`);\n    L.push(\"\");\n    S.results.forEach((r,k) => {\n      const t = TASKS[k];\n      const st = r.status===\"completed\" ? \"Completed (detected)\" : r.status===\"self\" ? \"Marked done by participant\" : r.status===\"skipped\" ? \"Skipped\" : \"Not reached\";\n      L.push(`${k+1}. ${t.title} [${t.time}]: ${st} in ${mmss(r.secs)}${r.hints?`, ${r.hints} hint`:\"\"}${r.ease?`, ease ${r.ease}/5 (${EASE[r.ease-1]})`:\"\"}${r.reason?`, reason: ${r.reason}`:\"\"}`);\n      const done = t.subs.filter(([s]) => s in r.subs).map(([s,label]) => `${label} @${mmss(r.subs[s])}`);\n      if (done.length) L.push(`   Steps: ${done.join(\"; \")}`);\n      if (r.comment.trim()) L.push(`   Said: \"${r.comment.trim()}\"`);\n      if (r.trail.length) L.push(`   Trail: ${r.trail.map(trailItem).join(\", \")}`);\n    });\n    L.push(\"\");\n    L.push(`Overall ease: ${S.closing.overall ? S.closing.overall+\"/5\" : \"-\"}`);\n    L.push(`Would use: ${S.closing.likely ? S.closing.likely+\"/5\" : \"-\"}`);\n    if (S.closing.change.trim()) L.push(`Would change: ${S.closing.change.trim()}`);\n    return L.join(\"\\n\");\n  }\n\n  // ---- Start over (two clicks, no browser confirm) -------------------------------------------\n  let armed = null;\n  $(\"restart\").onclick = () => {\n    const b = $(\"restart\");\n    if (!armed){ b.textContent = \"Click again to start over\"; b.classList.add(\"ut-warn\"); armed = setTimeout(() => { armed = null; b.textContent = \"Start over\"; b.classList.remove(\"ut-warn\"); }, 3500); return; }\n    clearTimeout(armed); armed = null; b.textContent = \"Start over\"; b.classList.remove(\"ut-warn\");\n    stopClock(); stopRecording(); S = fresh(); $(\"finale\").classList.add(\"ut-gone\"); $(\"intro\").classList.remove(\"ut-gone\"); $(\"gate\").classList.remove(\"ut-show\");\n    emit(\"ut:reset\"); panel.innerHTML = \"\"; paintSteps(); intro(1);\n  };\n\n  // Don't lose a session to an accidental tab close.\n  window.addEventListener(\"beforeunload\", (e) => { if (S.phase!==\"intro\" && !S.saved){ e.preventDefault(); e.returnValue = \"\"; } });\n\n  // Phones get the stacked layout. Prototypes that cannot adapt with CSS alone listen for this.\n  const syncViewport = () => emit(\"ut:viewport\", mq.matches ? \"mobile\" : \"desktop\");\n  mq.addEventListener ? mq.addEventListener(\"change\", syncViewport) : mq.addListener(syncViewport);\n  setTimeout(syncViewport, 400);\n\n  paintSteps(); intro(1);\n})();\n<\/script>\n<\/body>\n<\/html>\n"</script>
<script>
(function(){
  const $ = (id) => document.getElementById(id);
  const SHELL = JSON.parse($("shell").textContent);
  const got = { C:null, P:null };
  async function take(k, file){
    if (!file) return;
    got[k] = await file.text();
    $("name"+k).textContent = file.name + " added";
    $("slot"+k).classList.add("ok");
    $("build").disabled = !(got.C && got.P);
    $("msg").textContent = ""; $("errs").hidden = true;
  }
  ["C","P"].forEach((k) => {
    $("file"+k).onchange = (e) => take(k, e.target.files[0]);
    const s = $("slot"+k);
    s.ondragover = (e) => { e.preventDefault(); s.classList.add("over"); };
    s.ondragleave = () => s.classList.remove("over");
    s.ondrop = (e) => { e.preventDefault(); s.classList.remove("over"); take(k, e.dataTransfer.files[0]); };
  });
  // The same checks as build.py.
  function check(config, proto){
    const errs = [];
    proto = proto.replace(/<!--[\s\S]*?-->/g, "");   // comments may mention anything
    if (!config.includes("UT_CONFIG")) errs.push("test-config.js must set window.UT_CONFIG.");
    if (/<\/script/i.test(config)) errs.push("test-config.js must not contain a closing script tag.");
    if (/<\s*(html|head|body)[\s>]/i.test(proto)) errs.push("prototype.html must be a fragment: remove <html>, <head> and <body>.");
    if (/(class|id)\s*=\s*["'][^"']*\but-/.test(proto)) errs.push('prototype.html uses a class or id starting with "ut-". That prefix belongs to the shell.');
    if (!proto.includes("UT.signal") && !proto.includes("ut:signal")) errs.push("prototype.html never reports anything: call UT.signal(type, detail) when the participant acts.");
    return errs;
  }
  $("build").onclick = () => {
    const errs = check(got.C, got.P);
    if (errs.length){ $("errs").hidden = false; $("errs").innerHTML = "<ul>" + errs.map((e) => "<li>" + e.replace(/</g,"&lt;") + "</li>").join("") + "</ul>"; return; }
    const html = SHELL.replace("/*UT:CONFIG*/", () => got.C).replace("<!--UT:PROTOTYPE-->", () => got.P);
    const m = got.C.match(/project\s*:\s*["']([^"']+)["']/);
    const name = (m ? m[1].replace(/[^A-Za-z0-9]+/g, "-").replace(/^-|-$/g, "") : "Prototype") + "-usability-test.html";
    const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([html], { type:"text/html" })); a.download = name; document.body.appendChild(a); a.click();
    setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
    $("msg").className = "msg good"; $("msg").textContent = "Built " + name + ". Open it and run every task once before you send it.";
  };
})();
</script>
</body>
</html>
